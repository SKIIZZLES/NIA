name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un seul run par référence : un nouveau push annule le précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  check:
    name: Typecheck & bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      # Rejoue la phase JS d'un build EAS : si le bundle casse ici, il casse
      # aussi sur EAS. La compilation native (Gradle / Xcode) n'est pas
      # couverte — seul un vrai build EAS l'exerce.
      - name: Bundle iOS
        run: npx expo export --platform ios --output-dir /tmp/export-ios

      - name: Bundle Android
        run: npx expo export --platform android --output-dir /tmp/export-android

      # Le web inclut le bundle serveur du rendu statique (`output: "static"`),
      # celui qui cassait sur les builtins Node avant le correctif de
      # metro.config.js. Le garder en CI empêche la régression.
      - name: Bundle web
        run: npx expo export --platform web --output-dir /tmp/export-web
